modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/Joscha-Goetz/Always-Sprint/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
description = '''Always auto sprint. No sprint key needed, and no toggling sprint again after every death.'''
${iconKey} = "assets/always-sprint/icon.png"
authors = "Joscha Goetz"
displayURL = "https://modrinth.com/mod/always-sprint"

[[mixins]]
config = "always-sprint.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
